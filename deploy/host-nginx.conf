# Collarbell (a pet-care app, github.com/larichevns/collarbell): a thin proxy into its docker stack in
# /opt/collarbell. The landing, the routes and the file links live inside the stack (deploy/nginx.conf in the
# repository), so deploys never change this file.
# On the server: /etc/nginx/sites-available/collarbell, enabled as sites-enabled/zz-collarbell so paddit-ru stays
# the default server for :80/:443. Certificate: certbot certonly --webroot -w /var/www/html, renewed by certbot.timer.

server {
    listen 80;
    server_name collarbell.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name collarbell.example.com;

    ssl_certificate     /etc/letsencrypt/live/collarbell.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/collarbell.example.com/privkey.pem;

    # Documents up to 15 MB, plus the form around them.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reading a passport page or a package with AI can take a few minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Live updates for the open screens (SignalR): a WebSocket. The client's Upgrade and Connection headers go on, so
    # nothing here is shared with the other sites (no map in the http block).
    location /hubs/ {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Both sides ping every 15 s.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
