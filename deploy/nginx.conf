# The routes of the public address, inside the web container. The host's nginx terminates HTTPS and passes
# everything here (host-nginx.conf), so a change of routes is an ordinary deploy, not an edit on the server.

# Docker's DNS, asked again every 10 s: a deploy recreates the api and storage containers with new addresses.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Documents up to 15 MB, plus the form around them.
    client_max_body_size 20m;

    # The host's nginx already logs every request (kept 14 days, as the privacy policy says).
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    set $api http://api:8080;
    set $storage http://storage:8333;

    # The API.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Reading a passport page or a package with AI can take a few minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Live updates for the open screens (SignalR, /hubs/household): a WebSocket that stays open while the app is in
    # front. Both sides ping every 15 s, so a minute and a half without a word means the connection is gone.
    location /hubs/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Asked by the app (is the server back?) and by the deploy script.
    location = /health {
        proxy_pass $api;
    }

    # File links from the API. They are signed for this address and path (bucket "collarbell"), so the storage
    # must see the same host and path. Downloads only: files are uploaded through the API.
    location /collarbell/ {
        limit_except GET {
            deny all;
        }
        proxy_pass $storage;
        proxy_set_header Host $host;
    }

    # The landing: every page is a folder with index.html; assets have hashed names and never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The owner's admin (admin/, React): one page for every address under /admin/, never indexed. The page is checked
    # for a newer version on every visit, so a deploy shows at once; its assets have hashed names and never change.
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin/assets/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The web app for pet owners (web/, React): the same, under /app/. Not indexed: it is all behind a sign-in.
    location /app/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /app/index.html;
    }

    location /app/assets/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
