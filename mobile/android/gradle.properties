# Kept modest: the build shares a 24 GB Mac with other projects. 3 GB is enough for the release build with R8.
# Kotlin compiles inside the Gradle daemon instead of a second JVM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
