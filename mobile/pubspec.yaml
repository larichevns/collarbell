name: collarbell
description: "Collarbell pet care"
publish_to: 'none'

# version: <build-name>+<build-number>; override with --build-name / --build-number.
version: 0.1.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Material Symbols Rounded (the same icons as the web app), weight 400 at
  # optical size 48 (CbIcons in theme/collarbell_theme.dart). Pinned: icon
  # names and glyphs change between releases.
  material_symbols_icons: 4.2960.0
  dio: ^5.11.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  go_router: ^17.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  retrofit: ^4.10.0
  json_annotation: ^4.9.0
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  cunning_document_scanner: ^3.0.3
  flutter_image_compress: ^2.5.1
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  mobile_scanner: ^7.4.2
  share_plus: ^13.3.1
  # Live updates: the SignalR client, behind RealtimeClient (data/live/).
  signalr_netcore: ^1.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # A fake clock for tests with timers (the visor's reporter, live updates).
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter
  swagger_parser: ^1.45.0
  build_runner: ^2.15.1
  retrofit_generator: ^10.2.9
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
  # Fonts from Google Fonts (OFL), bundled with the app: no downloads, works
  # offline. Arimo (the free twin of Arial) is the interface font where the
  # system has no Helvetica Neue, i.e. on Android (theme/cb_fonts.dart).
  # Only these weights exist: 400, 500, 700.
  fonts:
    - family: Arimo
      fonts:
        - asset: assets/google_fonts/Arimo-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Arimo-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Arimo-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/google_fonts/JetBrainsMono-Medium.ttf
          weight: 500
  # The fonts' OFL licences, shown on the licences screen (main.dart).
  assets:
    - assets/google_fonts/
  # Generates lib/l10n/app_localizations*.dart from the ARB files (see l10n.yaml).
  generate: true
