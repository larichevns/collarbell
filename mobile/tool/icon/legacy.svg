<svg xmlns="http://www.w3.org/2000/svg" width="683" height="683" viewBox="170.5 170.5 683 683">
  <!-- Android before 8.0 has no adaptive icons: it gets what a round launcher would show, the middle of
       icon.svg cut to a circle. -->
  <defs><clipPath id="round"><circle cx="512" cy="512" r="341.5"/></clipPath></defs>
  <image href="icon.svg" width="1024" height="1024" clip-path="url(#round)"/>
</svg>
