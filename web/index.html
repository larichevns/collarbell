<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191e28" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Collarbell</title>
    <script>
      // The theme picked in Settings (src/theme.ts), before the first paint: a dark pick doesn't flash white.
      try {
        var theme = window.localStorage.getItem('collarbell.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (error) {
        // Storage switched off: the system's theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Collarbell needs JavaScript. · Collarbell нужен JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
